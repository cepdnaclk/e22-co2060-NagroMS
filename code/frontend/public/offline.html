<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NagroMS — Offline</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f1a12 0%, #1a3a1f 50%, #0f1a12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2f5e6;
      text-align: center;
      padding: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(124, 222, 90, 0.2);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #7cde5a;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #a8d5b0;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 2rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .retry-btn {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #1a6b2e, #2d9e4a);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(26, 107, 46, 0.4);
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(26, 107, 46, 0.5);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .footer-text {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #5a8c63;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌱</div>
    <h1>You're Offline</h1>
    <p class="subtitle">
      NagroMS needs an internet connection to load fresh farm data.
      Check your connection and try again.
    </p>

    <div class="status-badge">
      <span class="dot"></span>
      No Internet Connection
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      🔄 Try Again
    </button>

    <p class="footer-text">NagroMS — Smart Agriculture Management</p>
  </div>
</body>
</html>
